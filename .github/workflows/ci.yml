name: Rust CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features
      - name: Smoke run (bounded)
        run: |
          cargo run --package topdown-racer > /tmp/topdown-racer-smoke.log 2>&1 &
          APP_PID=$!

          sleep 10

          if kill -0 "$APP_PID" 2>/dev/null; then
            kill -TERM "$APP_PID" || true
            wait "$APP_PID" 2>/dev/null || true
            echo "[smoke] topdown-racer started and was terminated after 10 seconds."
          else
            if ! wait "$APP_PID"; then
              echo "[smoke] topdown-racer exited unexpectedly."
              tail -n 80 /tmp/topdown-racer-smoke.log
              exit 1
            fi
            echo "[smoke] topdown-racer exited quickly with success."
          fi
